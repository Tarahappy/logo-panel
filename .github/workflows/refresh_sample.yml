name: Refresh sample (S&P 500 list + homepages)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "11 8 5 1,4,7,10 *"   # quarterly; firms that leave the index are kept

permissions:
  contents: write

concurrency:
  group: logo-panel-data
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # start from the newest commit on main, not the commit the run was queued on,
          # so a run that waited behind another one does not overwrite its results
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: cd scripts && python build_sample.py
      - name: Commit
        run: |
          git config user.name "logo-panel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config
          git diff --cached --quiet || git commit -q -m "Refresh sample $(date -u +%F)"
          if ! git pull -q --rebase --autostash; then
            git rebase --abort || true
            echo "::error::Could not merge with newer commits on main. This run's results are saved as an artifact (unsaved-results) on the run page."
            exit 1
          fi
          git push -q
      - name: Save results if they could not be committed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-results-${{ github.run_id }}
          path: |
            config
          retention-days: 30
